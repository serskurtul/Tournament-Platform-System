# App of Apps root (ЛР-5 п.4). This is the ONLY object applied by hand:
#   kubectl apply -f bootstrap/root-app.yaml
# Argo CD then reads argocd-apps/ from Git and creates every child Application from there.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/serskurtul/Tournament-Platform-System.git
    targetRevision: main
    path: argocd-apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
