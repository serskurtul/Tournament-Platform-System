name: SonarCloud analysis

# ЛР-8 (Інженерія якості), Завдання 1: fresh SonarCloud analysis + programmatic export of metrics
# through the Web API (raw JSON kept as a build artifact).
#
# One-time setup (repository Settings):
#   1. Import the repository at https://sonarcloud.io (free for public repositories).
#   2. Secrets -> Actions: SONAR_TOKEN = a SonarCloud user token.
#   3. (optional) Variables -> Actions: SONAR_ORG, SONAR_PROJECT if they differ from
#      "<owner>" and "<owner>_<repository>" (SonarCloud's defaults for imported repositories).
# Then run it from the Actions tab ("Run workflow").
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORG: ${{ vars.SONAR_ORG || github.repository_owner }}
      SONAR_PROJECT: ${{ vars.SONAR_PROJECT || format('{0}_{1}', github.repository_owner, github.event.repository.name) }}
      SONAR_HOST: https://sonarcloud.io
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Analyse (begin -> build -> end)
        run: |
          dotnet sonarscanner begin /k:"$SONAR_PROJECT" /o:"$SONAR_ORG" /d:sonar.token="$SONAR_TOKEN" /d:sonar.host.url="$SONAR_HOST"
          dotnet build server/TournamentPlatformSystemWebApi.sln -c Release
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Wait for SonarCloud to process the report
        run: sleep 90

      - name: Export metrics through the Web API (raw JSON)
        run: scripts/quality/sonar_measures.sh sonar-report

      - name: Upload raw API responses
        uses: actions/upload-artifact@v4
        with:
          name: sonar-report
          path: sonar-report/
