# DVO-L4-3C8B52
# minikube (GitOps target for ЛР-5..7). Argo CD reads this file from Git.
# Final state after ЛР-7: canary Rollout with analysis, monitoring and dashboards enabled.
# No secrets here: the dev placeholders from values.yaml apply (dev-only, not real credentials).
api:
  image:
    # Changing this tag in Git is the release mechanism (ЛР-5 1.1.0, ЛР-6 1.2.0, ЛР-6 abort test 1.3.0).
    tag: "1.2.0"
  replicaCount: 5
  # Demo knob (ЛР-7 bad release): set e.g. "0.5" in Git to ship a failing version.
  failRate: "0"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

client:
  replicaCount: 1

ingress:
  enabled: true
  host: tournament.local

rollout:
  enabled: true
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: {}
        - analysis: {}
        - setWeight: 60
        - pause:
            duration: 30s
        - setWeight: 80
        - pause:
            duration: 30s

analysis:
  enabled: true

metrics:
  serviceMonitor:
    enabled: true
    interval: 15s
  alerts:
    enabled: true

dashboards:
  enabled: true

# ЛР-12: daily DB backup (ISD §7).
backup:
  enabled: true
