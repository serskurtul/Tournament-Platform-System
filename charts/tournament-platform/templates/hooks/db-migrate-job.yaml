# DVO-L4-3C8B52
# Hook: applies EF Core migrations after install and upgrade; seeds data only on the first install.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tournament.componentName" (dict "root" . "component" "db-migrate") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tournament.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- include "tournament.annotations" . | nindent 4 }}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "tournament.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          env:
            - name: POSTGRES_USER
              value: {{ .Values.config.postgresUser | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.config.postgresDb | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tournament.componentName" (dict "root" . "component" "secrets") }}
                  key: POSTGRES_PASSWORD
            - name: ConnectionStrings__DefaultConnection
              value: "Server={{ include "tournament.componentName" (dict "root" . "component" "postgres") }};Port=5432;Database=$(POSTGRES_DB);User Id=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD);"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              for i in $(seq 1 30); do
                pg_isready -h {{ include "tournament.componentName" (dict "root" . "component" "postgres") }} -U "$POSTGRES_USER" && break
                sleep 2
              done
              cd /src/TournamentPlatformSystemWebApi.Infrastructure
              dotnet ef database update -s ../TournamentPlatformSystemWebApi.API
              {{- if and .Release.IsInstall .Values.db.seedOnInstall }}
              PGPASSWORD="$POSTGRES_PASSWORD" psql -h {{ include "tournament.componentName" (dict "root" . "component" "postgres") }} -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f /app/seed.sql
              {{- end }}
