# DVO-L4-3C8B52
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tournament.componentName" (dict "root" . "component" "postgres") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tournament.labels" . | nindent 4 }}
    {{- include "tournament.selectorLabels" (dict "root" . "component" "postgres") | nindent 4 }}
  annotations:
    {{- include "tournament.annotations" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "tournament.selectorLabels" (dict "root" . "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
