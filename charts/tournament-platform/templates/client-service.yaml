# DVO-L4-3C8B52
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tournament.componentName" (dict "root" . "component" "client") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tournament.labels" . | nindent 4 }}
    {{- include "tournament.selectorLabels" (dict "root" . "component" "client") | nindent 4 }}
  annotations:
    {{- include "tournament.annotations" . | nindent 4 }}
spec:
  type: {{ .Values.client.service.type }}
  selector:
    {{- include "tournament.selectorLabels" (dict "root" . "component" "client") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.client.service.port }}
      targetPort: http
      {{- if and (eq .Values.client.service.type "NodePort") .Values.client.service.nodePort }}
      nodePort: {{ .Values.client.service.nodePort }}
      {{- end }}
