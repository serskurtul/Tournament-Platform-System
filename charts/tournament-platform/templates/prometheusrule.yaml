# DVO-L4-3C8B52
# Optional alert (ЛР-7 задача d*): share of 5xx responses above 5% for 1 minute.
{{- if .Values.metrics.alerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "tournament.componentName" (dict "root" . "component" "alerts") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tournament.labels" . | nindent 4 }}
  annotations:
    {{- include "tournament.annotations" . | nindent 4 }}
spec:
  groups:
    - name: tournament-api
      rules:
        - alert: TournamentApiHighErrorRate
          expr: |
            sum(rate(http_requests_total{job="{{ include "tournament.componentName" (dict "root" . "component" "api") }}",status=~"5.."}[2m]))
            /
            sum(rate(http_requests_total{job="{{ include "tournament.componentName" (dict "root" . "component" "api") }}"}[2m]))
            > 0.05
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Tournament API: more than 5% of requests fail with 5xx"
            description: "Share of 5xx responses has stayed above 5% for 1 minute."
{{- end }}
