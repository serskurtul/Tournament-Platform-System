# DVO-L4-3C8B52
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tournament.componentName" (dict "root" . "component" "secrets") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tournament.labels" . | nindent 4 }}
    {{- include "tournament.selectorLabels" (dict "root" . "component" "secrets") | nindent 4 }}
  annotations:
    {{- include "tournament.annotations" . | nindent 4 }}
type: Opaque
stringData:
  # Values come from the chart values, never hardcoded in this template.
  # required: fail fast instead of deploying an empty password.
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword must be set (use --set-file or an external secret)" .Values.secrets.postgresPassword | quote }}
  JWT__KEY: {{ required "secrets.jwtKey must be set (use --set-file or an external secret)" .Values.secrets.jwtKey | quote }}
