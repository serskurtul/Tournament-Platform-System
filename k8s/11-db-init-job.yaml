# DVO-L3-7F2A91
# One-shot Job: applies EF Core migrations and seeds the database (the compose "init" service equivalent).
# Jobs are immutable: delete it before re-running (kubectl -n tournament-platform delete job tournament-db-init).
apiVersion: batch/v1
kind: Job
metadata:
  name: tournament-db-init
  namespace: tournament-platform
  labels:
    app.kubernetes.io/name: tournament-db-init
    app.kubernetes.io/part-of: tournament-platform
    mascot: kabachok
  annotations:
    devops-lab/mascot-approved: "true"
    devops-lab/mascot-name: "кабачок"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tournament-db-init
        app.kubernetes.io/part-of: tournament-platform
        mascot: kabachok
      annotations:
        devops-lab/mascot-approved: "true"
        devops-lab/mascot-name: "кабачок"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: ghcr.io/serskurtul/tournament-platform-server:1.0.0
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: tournament-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: tournament-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tournament-secrets
                  key: POSTGRES_PASSWORD
            - name: ConnectionStrings__DefaultConnection
              value: "Server=postgres;Port=5432;Database=$(POSTGRES_DB);User Id=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD);"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              until pg_isready -h postgres -U "$POSTGRES_USER"; do sleep 2; done
              cd /src/TournamentPlatformSystemWebApi.Infrastructure
              dotnet ef database update -s ../TournamentPlatformSystemWebApi.API
              PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f /app/seed.sql
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
