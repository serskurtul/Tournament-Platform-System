# DVO-L3-7F2A91
# PersistentVolumeClaim for the stateful database (lab requirement 4g).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: tournament-platform
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: tournament-platform
    mascot: kabachok
  annotations:
    devops-lab/mascot-approved: "true"
    devops-lab/mascot-name: "кабачок"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
